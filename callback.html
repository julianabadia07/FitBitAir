<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando…</title>
<style>
  body { background: #0d0f14; color: #c8cfe8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 20px; }
  .spinner { width: 44px; height: 44px; border: 3px solid #1e2330; border-top-color: #5b9cf6; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 14px; color: #6b7494; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>Conectando con Google…</p>
<script>
  // Google redirige aquí con el token en el hash (#access_token=...)
  // Lo pasamos al index principal vía sessionStorage y redirigimos
  const hash = new URLSearchParams(location.hash.replace('#',''));
  const token = hash.get('access_token');
  if (token) {
    sessionStorage.setItem('gh_token', token);
    location.href = '/';
  } else {
    document.querySelector('p').textContent = 'Error: no se recibió token. Vuelve a intentarlo.';
    setTimeout(() => location.href = '/', 3000);
  }
</script>
</body>
</html>
